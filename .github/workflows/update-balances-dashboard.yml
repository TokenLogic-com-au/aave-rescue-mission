name: Update Balances Dashboard

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      chain:
        description: "Chain to scan (or all)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - mainnet
          - polygon
          - arbitrum
          - optimism
          - base
          - avalanche
          - bnb
          - gnosis
          - scroll
          - mantle
          - celo
          - metis
          - xlayer
          - sonic
          - plasma
          - zksync
      repin:
        description: "Force re-pin to current head block"
        required: false
        default: false
        type: boolean

permissions: {}

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Fetch previous balances from the published site
        env:
          PREVIOUS_CACHE_URL: ${{ steps.pages.outputs.base_url }}/data/balances-cache.json
        run: |
          status=$(curl -sS --retry 3 --connect-timeout 15 --max-time 60 -o balances-cache.json -w '%{http_code}' "$PREVIOUS_CACHE_URL")
          case "$status" in
            200)
              jq -e '.chains | type == "object"' balances-cache.json > /dev/null
              echo "Seeded from $PREVIOUS_CACHE_URL ($(jq '.chains | length' balances-cache.json) entries)"
              ;;
            404)
              rm -f balances-cache.json
              echo "::notice::No published balances at $PREVIOUS_CACHE_URL, running a full scan from an empty cache"
              ;;
            *)
              echo "::error::Fetching $PREVIOUS_CACHE_URL returned HTTP $status"
              exit 1
              ;;
          esac

      - name: Run Aave Balances Scanner
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHAIN: ${{ inputs.chain }}
          INPUT_REPIN: ${{ inputs.repin }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            ARGS="--all --repin"
          elif [ "$INPUT_CHAIN" != "all" ]; then
            ARGS="--chain $INPUT_CHAIN"
          else
            ARGS="--all"
          fi
          if [ "$INPUT_REPIN" = "true" ]; then
            ARGS="$ARGS --repin"
          fi
          npx tsx scan-aave-balances.ts $ARGS

      - name: Build dashboard
        run: yarn build:dashboard

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
