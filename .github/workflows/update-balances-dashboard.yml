name: Update Balances Dashboard

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      chain:
        description: "Chain to scan (or all)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - mainnet
          - polygon
          - arbitrum
          - optimism
          - base
          - avalanche
          - bnb
          - gnosis
          - scroll
          - mantle
          - celo
          - metis
          - xlayer
          - sonic
          - plasma
          - zksync
      repin:
        description: "Force re-pin to current head block"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Aave Balances Scanner
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="--all --repin"
          elif [ "${{ inputs.chain }}" != "all" ]; then
            ARGS="--chain ${{ inputs.chain }}"
          else
            ARGS="--all"
          fi
          if [ "${{ inputs.repin }}" = "true" ]; then
            ARGS="$ARGS --repin"
          fi
          npx tsx scan-aave-balances.ts $ARGS

      - name: Rebuild Dashboard with Fresh Cache
        run: yarn build:dashboard

      - name: Fix formatting of generated HTML
        run: npx prettier --write docs/index.html docs/data/balances-cache.json balances-cache.json

      - name: Commit Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add balances-cache.json docs/data/balances-cache.json docs/index.html
          # Discard any unstaged changes to other files so git rebase is guaranteed a clean working tree
          git checkout -- .
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update aave balances cache [skip ci]"
            pushed=false
            for attempt in 1 2 3 4 5; do
              echo "Sync and push attempt $attempt..."
              git fetch origin "${{ github.ref_name }}"
              if git rebase -X theirs "origin/${{ github.ref_name }}"; then
                if git push origin "HEAD:${{ github.ref_name }}"; then
                  echo "Successfully pushed updated balances."
                  pushed=true
                  break
                fi
              else
                git rebase --abort || true
              fi
              echo "Push failed, retrying in 3 seconds..."
              sleep 3
            done
            if [ "$pushed" = false ]; then
              echo "Failed to push updated balances after multiple attempts."
              exit 1
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
